<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cONstRuct — Downloads</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 40px 20px;
        }

        main {
            width: min(100%, 900px);
            margin: 0 auto;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 32px;
            letter-spacing: 2px;
        }

        .subtitle {
            margin: 10px 0 35px;
            text-align: center;
            color: #999;
        }

        #downloads {
            display: grid;
            gap: 12px;
        }

        .file {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 20px;
            border: 1px solid #292929;
            background: #0b0b0b;
        }

        .file-name {
            min-width: 0;
            font-size: 16px;
            overflow-wrap: anywhere;
        }

        .file-path {
            margin-top: 5px;
            color: #777;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .download {
            flex: 0 0 auto;
            display: inline-block;
            padding: 9px 15px;
            border: 1px solid #fff;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            transition: background 0.15s, color 0.15s;
        }

        .download:hover {
            background: #fff;
            color: #000;
        }

        .message {
            padding: 25px;
            border: 1px solid #292929;
            background: #0b0b0b;
            color: #888;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }

            .file {
                align-items: flex-start;
                flex-direction: column;
            }

            .download {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>cONstRuct</h1>
        <p class="subtitle">Available files</p>

        <div id="downloads">
            <div class="message">Loading files...</div>
        </div>
    </main>

    <script>
        const repository = "ThePhirst/cONstRuct";
        const branch = "main";
        const apiUrl = `https://api.github.com/repos/${repository}/git/trees/${branch}?recursive=1`;

        const downloads = document.getElementById("downloads");

        function getDownloadUrl(path) {
            return `https://github.com/${repository}/raw/refs/heads/${branch}/${path.split("/").map(encodeURIComponent).join("/")}`;
        }

        function createFileElement(file) {
            const item = document.createElement("div");
            item.className = "file";

            const info = document.createElement("div");

            const name = document.createElement("div");
            name.className = "file-name";
            name.textContent = file.path.split("/").pop();

            const path = document.createElement("div");
            path.className = "file-path";
            path.textContent = file.path;

            info.appendChild(name);
            info.appendChild(path);

            const button = document.createElement("a");
            button.className = "download";
            button.href = getDownloadUrl(file.path);
            button.download = file.path.split("/").pop();
            button.textContent = "Download";

            item.appendChild(info);
            item.appendChild(button);

            return item;
        }

        async function loadFiles() {
            try {
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error("GitHub API request failed");
                }

                const data = await response.json();

                const files = data.tree.filter(file =>
                    file.type === "blob" &&
                    file.path !== "index.html" &&
                    file.path !== "README.md"
                );

                downloads.innerHTML = "";

                if (files.length === 0) {
                    downloads.innerHTML = '<div class="message">No downloadable files are currently available.</div>';
                    return;
                }

                files.forEach(file => {
                    downloads.appendChild(createFileElement(file));
                });
            } catch (error) {
                downloads.innerHTML = '<div class="message">Unable to load the available files.</div>';
                console.error(error);
            }
        }

        loadFiles();
    </script>
</body>
</html>
